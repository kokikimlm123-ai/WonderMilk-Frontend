name: V1 Knowledge Library Regression
on:
  push:
    branches:
      - argo-wm-v1-nutrition-knowledge-20261015
      - argo-wm-v1-mastitis-knowledge-20261015
      - argo-wm-v1-forage-analysis-guide-20261015
      - argo-wm-v1-group-translation-multilingual-20261017
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Test V1 farm CVAS knowledge and multilingual LINE workflows
        working-directory: services/line-agent
        env:
          PYTHON_BIN: python
        run: npm test
