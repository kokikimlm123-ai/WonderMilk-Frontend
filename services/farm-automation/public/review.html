<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGO-WM V2 · Farm review</title>
<style>body{margin:0;background:#f2f5f2;color:#153c32;font:16px/1.6 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:28px;margin:6px 0}section{background:white;border:1px solid #d6e2db;border-radius:14px;padding:22px;margin:18px 0}label{display:block;margin:10px 0}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #bccdc4;border-radius:8px;box-sizing:border-box}input,textarea{width:100%}textarea{font:14px/1.6 monospace;min-height:240px}button{background:#165e49;color:white;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.5;cursor:wait}.muted{color:#61776a}.grid{display:grid;grid-template-columns:260px 1fr;gap:18px}.row{display:block;background:#edf4ef;color:#153c32;width:100%;text-align:left}.danger{background:#903629}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{white-space:pre-wrap}img{max-width:100%;max-height:600px}#issues{color:#91391c}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:14px}header{align-items:flex-start}}</style>
<main><header><div><div class="muted">ARGO-WM V2 · DEVELOPMENT</div><h1 data-i="title">Farm record review</h1></div><select id="language" aria-label="Language"><option value="en">English</option><option value="my">မြန်မာ</option><option value="th">ไทย</option></select></header>
<p data-i="intro">Drafts require human approval. This is the isolated development pilot.</p>
<section id="login"><label data-i="token" for="token">Reviewer access token</label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="connect" data-i="connect">Open drafts</button><p class="muted" data-i="privacy">Your token stays in this page's memory only. Do not paste a LINE or OpenAI key here.</p></section>
<p id="message" role="status"></p>
<div id="workspace" hidden><section><h2>Google Drive</h2><p id="google-status"></p><button id="google-connect" data-i="googleConnect">Connect Google Drive</button></section><button id="refresh" data-i="refresh">Refresh</button><button id="logout" data-i="logout">Sign out</button><div class="grid"><section><h2 data-i="drafts">Drafts</h2><div id="list"></div></section><section id="detail" hidden><h2 id="heading"></h2><p id="issues"></p><h3 data-i="source">Source message</h3><pre id="source"></pre><button id="photo" data-i="photo">View source photo</button><img id="image" hidden alt="Source evidence"><label for="records" data-i="records">Extracted records — check and correct before approval</label><textarea id="records" spellcheck="false"></textarea><label for="reason" data-i="reason">Review reason</label><input id="reason" maxlength="1000"><button id="approve" data-i="approve">Approve</button><button id="reject" class="danger" data-i="reject">Reject</button></section></div></div>
</main><script src="/review.js"></script></html>
